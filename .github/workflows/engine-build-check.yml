# APIS-1138 check, run from a fork and not meant to be merged.
#
# Builds and packages the engine twice in its CI build image (cubridci/cubridci:develop), the way
# gha-ci does (/entrypoint.sh build, then dist), and runs the CTP medium suite on each build
# (/entrypoint.sh test, the public cubrid-testcases):
#   ant    - CUBRID/cubrid and CUBRID/cubrid-jdbc at the commits the APIS-1138 branches start from
#   gradle - the engine's APIS-1138 branch from the fork, and this commit of cubrid-jdbc, with ant
#            hidden from the build
# then compares what the two packages ship in jdbc/, the Gradle dependency downloads they log, and
# the medium cases that fail. Both builds are release builds (gha-ci tests a debug one), so the
# medium failures matter only where the two lists differ.
name: engine-build-check

# workflow_dispatch would need this file on the default branch: rerun a push from the Actions tab.
on:
  push:
    branches: [APIS-1138-ci]

permissions:
  contents: read

env:
  IMAGE: cubridci/cubridci:develop

jobs:
  build:
    name: engine build (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: ant
            engine_repo: CUBRID/cubrid
            engine_ref: 785021eed4d30f77b56a606cafd566cc1d066381
            jdbc_url: https://github.com/CUBRID/cubrid-jdbc
            jdbc_ref: 5b46b6c26783a420ae2bc326768ff2edda791f6d
            hide_ant: false
          - leg: gradle
            engine_repo: ${{ github.repository_owner }}/cubrid
            engine_ref: APIS-1138
            jdbc_url: ${{ github.server_url }}/${{ github.repository }}
            jdbc_ref: ${{ github.sha }}
            hide_ant: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Never shallow: build.sh and gen_version.cmake take the serials from git rev-list --count.
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.engine_repo }}
          ref: ${{ matrix.engine_ref }}
          path: cubrid
          fetch-depth: 0

      - name: Check out the submodules, cubrid-jdbc at the commit under test
        working-directory: cubrid
        run: |
          git submodule update --init cubrid-cci cubridmanager cubrid-jdbc
          git -C cubrid-jdbc fetch --quiet --no-tags "${{ matrix.jdbc_url }}" "${{ matrix.jdbc_ref }}"
          git -C cubrid-jdbc checkout --quiet --detach FETCH_HEAD
          git log --oneline -1
          git -C cubrid-jdbc log --oneline -1

      # One container for the build, the package and the test: the build installs CUBRID inside it.
      # --init: PID 1 must reap zombies, or `cubrid server stop` hangs (gha-ci checks the same).
      - name: Start a container from ${{ env.IMAGE }}
        working-directory: cubrid
        run: |
          docker run -d --init --name ci -e HIDE_ANT=${{ matrix.hide_ant }} -e TEST_SUITE=medium \
            -v "$PWD:/home/src" -w /home/src --entrypoint /bin/bash "$IMAGE" -c 'sleep infinity'
          echo "PID 1: $(docker exec ci ps -p 1 -o comm=)"
          docker exec ci bash -lc '
            git config --global --add safe.directory "*"
            if [ "$HIDE_ANT" = true ] && command -v ant > /dev/null; then
              mv "$(command -v ant)" /tmp/ant.hidden
            fi'

      - name: Build and package
        run: docker exec ci bash -lc '/entrypoint.sh build && /entrypoint.sh dist -z tarball -z jdbc'

      - name: Collect the jdbc/ files of the package and the Gradle downloads
        working-directory: cubrid
        run: |
          tarball=$(ls build_x86_64_release/CUBRID-*-Linux.x86_64.tar.gz)
          tar tzf "$tarball" | grep -E '(^|/)jdbc/' | sort > jdbc-files.txt
          mkdir -p jdbc-jars
          tar xzf "$tarball" -C jdbc-jars --wildcards '*jdbc/cubrid-jdbc-*.jar'
          for jar in $(find jdbc-jars -name 'cubrid-jdbc-*.jar' | sort); do
            echo "== ${jar##*/}"
            unzip -Z1 "$jar" | grep -v '/$' | sort
          done > jdbc-jar-entries.txt
          { grep -h 'needs an update' build.log dist.log || true
            grep -h 'Downloading https://services.gradle.org' build.log dist.log || true
          } > gradle-downloads.txt
          cat jdbc-files.txt gradle-downloads.txt

      # /entrypoint.sh test fails when any case fails; the compare job judges the two failure lists.
      # The suite takes a few minutes in gha-ci, so an hour means it hangs.
      - name: Run the CTP medium suite
        working-directory: cubrid
        timeout-minutes: 60
        run: |
          set +e
          docker exec ci bash -lc '/entrypoint.sh test' 2>&1 | tee medium.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "medium: /entrypoint.sh test exited $rc"
          { grep -E '^\[checkout\]' medium.log || true; } | tee medium-checkout.txt
          # summary_info has a "<case>:ok    <time>ms" or "<case>:nok    <time>ms" line per case.
          docker exec ci bash -lc '
            find /home/cubrid-testtools/CTP/sql/result -type f -name summary_info -exec cat {} + \
              > /home/src/medium-summary.txt 2> /dev/null || true
            rm -rf /home/src/medium-xml
            if [ -d "$TEST_REPORT" ]; then cp -r "$TEST_REPORT" /home/src/medium-xml; fi'
          { grep -hE ':nok[[:space:]]' medium-summary.txt || true; } | awk -F: '{print $1}' \
            | sed 's|.*/cubrid-testcases/||' | sort > medium-failed.txt
          echo "medium: $(grep -cE ':(ok|nok)[[:space:]]' medium-summary.txt || true) results," \
            "$(grep -c . medium-failed.txt || true) failed"

      - name: Remove the container
        if: always()
        run: docker rm -fv ci || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-build-${{ matrix.leg }}
          path: |
            cubrid/build.log
            cubrid/dist.log
            cubrid/jdbc-files.txt
            cubrid/jdbc-jar-entries.txt
            cubrid/gradle-downloads.txt
            cubrid/medium.log
            cubrid/medium-checkout.txt
            cubrid/medium-summary.txt
            cubrid/medium-failed.txt
            cubrid/medium-xml/

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Compare the two builds
        working-directory: results
        run: |
          # The engine and the driver versions differ between the two builds by their git serials.
          norm() { sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<version>/g' "$1"; }
          status=0
          for f in jdbc-files.txt jdbc-jar-entries.txt; do
            echo "== $f: ant vs gradle"
            if diff <(norm engine-build-ant/$f) <(norm engine-build-gradle/$f); then
              echo "same"
            else
              status=1
            fi
          done
          echo "== Gradle downloads the gradle build logged beyond the ant build's"
          if grep -vxF -f engine-build-ant/gradle-downloads.txt engine-build-gradle/gradle-downloads.txt; then
            status=1
          else
            echo "none"
          fi
          echo "== CTP medium: the test commits each build ran"
          cat engine-build-ant/medium-checkout.txt engine-build-gradle/medium-checkout.txt
          commits() { sed -E 's/^\[checkout\] ([^ ]+) @ [^ ]+ -> ([0-9a-f]+).*/\1 \2/' "$1"; }
          if ! diff <(commits engine-build-ant/medium-checkout.txt) \
                    <(commits engine-build-gradle/medium-checkout.txt) > /dev/null; then
            echo "::warning::the two builds ran different test commits, so their failures may differ for that"
          fi
          for leg in ant gradle; do
            echo "$leg: $(grep -cE ':(ok|nok)[[:space:]]' engine-build-$leg/medium-summary.txt || true) results," \
              "$(grep -c . engine-build-$leg/medium-failed.txt || true) failed"
            if ! grep -qE ':(ok|nok)[[:space:]]' engine-build-$leg/medium-summary.txt; then
              echo "::error::the $leg build has no medium result"
              status=1
            fi
          done
          echo "== CTP medium failures: ant vs gradle"
          if diff engine-build-ant/medium-failed.txt engine-build-gradle/medium-failed.txt; then
            echo "same"
          else
            status=1
          fi
          exit $status
